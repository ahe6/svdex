AWSTemplateFormatVersion: '2010-09-09'
Description: Native Discourse uploads, separate from private releases/backups. Private documents use per-object ACLs and Discourse authorization.
Parameters:
  Environment:
    Type: String
    AllowedValues: [staging, production]
  HostRoleName:
    Type: String
  SiteOrigin:
    Type: String
    AllowedPattern: 'https://(staging\.)?svdex\.com'
Resources:
  UploadBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'svdex-${Environment}-uploads-${AWS::AccountId}-${AWS::Region}'
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerPreferred
      # Native S3Store sets public-read for public assets and private for secure
      # uploads. Never apply a blanket Allow GetObject bucket policy. The private
      # backup bucket keeps its existing, stricter Block Public Access settings.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref SiteOrigin]
            AllowedMethods: [GET, HEAD, PUT, POST]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: IncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
          - Id: NativeTombstones
            Status: Enabled
            Prefix: tombstone/
            ExpirationInDays: 30
      Tags:
        - Key: App
          Value: SVDEX
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: native-discourse-uploads
  UploadBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref UploadBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt UploadBucket.Arn, !Sub '${UploadBucket.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: false
  HostUploadAccess:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub 'Svdex-${Environment}-NativeUploads'
      Roles: [!Ref HostRoleName]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: ["s3:ListBucket", "s3:GetBucketLocation", "s3:ListBucketMultipartUploads"]
            Resource: !GetAtt UploadBucket.Arn
          - Effect: Allow
            Action: ["s3:GetObject", "s3:PutObject", "s3:DeleteObject", "s3:GetObjectAcl", "s3:PutObjectAcl", "s3:PutObjectTagging", "s3:AbortMultipartUpload", "s3:ListMultipartUploadParts"]
            Resource: !Sub '${UploadBucket.Arn}/*'
Outputs:
  UploadBucket:
    Value: !Ref UploadBucket

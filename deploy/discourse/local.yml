# Loopback-only instance using the upstream Discourse Docker templates.
# Persistent data lives in named Docker volumes, not the application database.
templates:
  - templates/postgres.template.yml
  - templates/redis.template.yml
  - templates/web.template.yml
  - templates/web.ratelimited.template.yml
expose:
  - "127.0.0.1:4080:80"
docker_args: "--network miscdex-discourse"
params:
  db_shared_buffers: "256MB"
  db_work_mem: "10MB"
  version: 444e62cc26e96c7da97f08fa45df219f03f60114
env:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  UNICORN_WORKERS: 2
  DISCOURSE_HOSTNAME: "localhost"
  DISCOURSE_PORT: 4080
  DISCOURSE_FORCE_HTTPS: "false"
  DISCOURSE_SKIP_EMAIL_SETUP: "1"
  DISCOURSE_DISABLE_EMAILS: "no"
  DISCOURSE_SMTP_ADDRESS: "miscdex-discourse-mail"
  DISCOURSE_SMTP_PORT: 1025
  DISCOURSE_SMTP_ENABLE_START_TLS: "false"
  DISCOURSE_NOTIFICATION_EMAIL: "notifications@miscdex.com"
  DISCOURSE_ALLOW_NEW_REGISTRATIONS: "false"
  DISCOURSE_ENABLE_LOCAL_LOGINS: "true"
  DISCOURSE_TITLE: "SVDEX"
  DISCOURSE_SITE_DESCRIPTION: "Companies, private markets, and the people building them."
volumes:
  - volume:
      host: miscdex-discourse-shared
      guest: /shared
  - volume:
      host: miscdex-discourse-logs
      guest: /var/log

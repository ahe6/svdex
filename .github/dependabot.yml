version: 2
updates:
  # Active CI actions and local/browser tooling; production Discourse pins are reviewed separately.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      development-tools:
        patterns: ["*"]
        update-types: [minor, patch]

name: Native Discourse checks
on:
  workflow_call:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-discourse-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native:
    # Reviewed manual runs while private; public contribution PRs run automatically.
    if: github.event_name == 'workflow_dispatch' || !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Classify pull request changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git diff --name-only -z "$PR_BASE_SHA" HEAD > "$RUNNER_TEMP/svdex-changed-files"
          python3 - <<'PY'
          import os,pathlib
          names=pathlib.Path(os.environ['RUNNER_TEMP'],'svdex-changed-files').read_bytes().decode('utf8',errors='surrogateescape').split('\0')
          prefixes=('frontend/','deploy/discourse/','scripts/','test/','.github/workflows/')
          needed=any(name and not name.endswith('.md') and (name.startswith(prefixes) or name == 'playwright.config.js' or name.startswith('package') and name.endswith('.json')) for name in names)
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(f'needs_forum={str(needed).lower()}\n')
          PY
      # Browser/system dependencies and the Docker forum build are independent.
      # Overlap preparation while retaining both exit statuses and every check.
      - name: Prepare the fresh forum and browser
        if: github.event_name != 'pull_request' || steps.changes.outputs.needs_forum == 'true'
        run: |
          browser_log="$RUNNER_TEMP/svdex-browser-install.log"
          npx playwright install --with-deps chromium --only-shell > "$browser_log" 2>&1 &
          browser_pid=$!
          setup_status=0
          npm run setup || setup_status=$?
          browser_status=0
          wait "$browser_pid" || browser_status=$?
          cat "$browser_log"
          if test "$setup_status" -ne 0; then exit "$setup_status"; fi
          exit "$browser_status"
      - name: Native permissions, financial workflows and theme compilation
        if: github.event_name != 'pull_request' || steps.changes.outputs.needs_forum == 'true'
        run: npm run check:discourse
      - name: Guest navigation and responsive browser checks
        if: github.event_name != 'pull_request' || steps.changes.outputs.needs_forum == 'true'
        run: npm run check:browser
      - name: Retain disposable-site browser screenshots and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/browser-results/
            artifacts/browser-report/
          if-no-files-found: ignore
          retention-days: 7
      - name: Runtime diagnostics without credential or database artifacts
        if: failure()
        run: |
          docker ps -a
          docker logs --tail 100 miscdex-forum 2>&1 || true
      - name: Stop isolated test containers
        if: always()
        run: npm run stop || true
